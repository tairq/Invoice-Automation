[project]
name = "invoice-processor"
version = "0.1.0"
description = "AI-powered invoice processing automation system"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Invoice Processor Team"},
]

dependencies = [
    # Web framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.25.0",
    "python-multipart>=0.0.6",

    # Database
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Validation & settings
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Task queue
    "celery>=5.3.6",
    "redis>=5.0.0",

    # PDF & image processing
    "pdfplumber>=0.10.0",
    "pypdf>=4.0.0",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.1",

    # OCR (fallback)
    "pytesseract>=0.3.10",

    # HTTP client (for LLM API calls)
    "httpx>=0.25.0",

    # File storage
    "boto3>=1.28.0",

    # Email
    "mail-parser>=3.15.0",

    # Folder watcher
    "watchdog>=3.0.0",

    # Fuzzy matching
    "rapidfuzz>=3.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "locust>=2.20.0",
    "aiosqlite>=0.19.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scripts/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
